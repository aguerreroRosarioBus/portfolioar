[tox]
envlist = py38, py39, py310, py311, lint
skip_missing_interpreters = true

[testenv]
deps =
    -r requirements.txt
    pytest
    pytest-django
commands =
    pytest {posargs}

[testenv:lint]
deps =
    flake8
    black
    isort
    mypy
    django-stubs
commands =
    flake8 .
    black --check .
    isort --check-only .
    mypy .

[testenv:format]
deps =
    black
    isort
commands =
    black .
    isort .

[testenv:clean]
deps =
    pytest-cache
commands =
    find . -type f -name "*.pyc" -delete
    find . -type d -name "__pycache__" -delete
    find . -type d -name "*.egg-info" -exec rm -rf {} +
    rm -rf .pytest_cache
    rm -rf .mypy_cache
    rm -rf htmlcov
    rm -rf .coverage