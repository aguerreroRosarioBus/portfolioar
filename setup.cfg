[metadata]
name = portfolioar
version = 0.1.0
author = Tu Nombre
author_email = tu@email.com
description = Sistema de gestión de inversiones para inversores argentinos
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/tu-usuario/portfolioar
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11

[options]
packages = find:
python_requires = >=3.8
install_requires =
    Django>=4.2,<5.0
    mssql-django>=1.3
    python-dotenv>=1.0
    pandas>=2.0
    pandas-ta>=0.3
    langchain>=0.1
    openai>=1.0
    requests>=2.31
    python-decouple>=3.8

[options.packages.find]
exclude = tests*

[options.extras_require]
dev =
    pytest
    pytest-django
    flake8
    black
    isort
    mypy
    django-stubs

[flake8]
max-line-length = 120
exclude = .git,__pycache__,build,dist,venv,env,*.egg-info
per-file-ignores =
    __init__.py:F401
    settings.py:E501

[isort]
profile = black
line_length = 120
known_first_party = ['core', 'portfolio', 'alerts']
known_third_party = ['django', 'pandas', 'requests', 'langchain']

[mypy]
python_version = 3.8
check_untyped_defs = True
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
plugins = mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = portfolioar.settings

